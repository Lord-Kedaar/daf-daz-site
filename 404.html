<!doctype html>
<html lang="de" class="scroll-smooth">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="description" content="Seite nicht gefunden – Radosław Pleskot, Deutschunterricht in Wien und online." />
    <link rel="icon" type="image/svg+xml" href="/assets/img/favicon.svg" />
    <link rel="stylesheet" href="/assets/css/styles.css" />
    <title>404 – Seite nicht gefunden | Radosław Pleskot</title>
    <style>
        .notfound {
            min-height: 70vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 3rem 1rem;
        }
        .notfound-inner {
            max-width: 560px;
        }
        .notfound-code {
            font-size: 5rem;
            font-weight: 700;
            color: var(--color-accent-main);
            margin-bottom: 0.5rem;
        }
        .notfound h1 {
            font-size: 1.75rem;
            margin-bottom: 1rem;
            color: var(--color-text-main);
        }
        .notfound p {
            color: var(--color-text-muted);
            margin-bottom: 2rem;
        }
        .notfound-langs {
            display: flex;
            gap: 0.75rem;
            justify-content: center;
            flex-wrap: wrap;
        }
        .notfound-langs a {
            padding: 0.6rem 1.25rem;
            border-radius: 50px;
            border: 1px solid var(--border, #ddd);
            color: var(--color-text-main);
            text-decoration: none;
            transition: background var(--transition-fast, 0.2s), color var(--transition-fast, 0.2s);
        }
        .notfound-langs a:hover {
            background: var(--color-accent-main);
            color: #fff;
            border-color: var(--color-accent-main);
        }
    </style>
</head>
<body>
    <main class="notfound">
        <div class="notfound-inner">
            <div class="notfound-code">404</div>
            <h1>Seite nicht gefunden</h1>
            <p>Diese Seite existiert nicht oder wurde verschoben.</p>
            <div class="notfound-langs">
                <a href="/" hreflang="de" lang="de">Deutsch — Startseite</a>
                <a href="/pl/" hreflang="pl" lang="pl">Polski — strona główna</a>
                <a href="/en/" hreflang="en" lang="en">English — homepage</a>
            </div>
        </div>
    </main>
</body>
</html>
